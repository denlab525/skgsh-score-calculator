<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聖功女中國中部-成績紀錄器</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen py-8 px-4">
    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-xl p-6 border border-slate-100">
        
        <!-- 標題 -->
        <h1 class="text-2xl font-bold text-center text-slate-800 mb-2 leading-snug">📊 聖功女中國中部-<br>成績紀錄器</h1>
        
        <!-- 隱私說明提示 -->
        <div class="bg-blue-50 border border-blue-100 text-blue-700 text-xs rounded-lg p-3 mb-5 text-left leading-relaxed">
            💡 <b>隱私說明</b>：本工具所輸入的成績僅儲存於您的手機裝置中，分享網址不會洩漏或共用個人分數，請安心使用！
        </div>

        <!-- 功能模式切換 -->
        <div class="flex rounded-xl bg-slate-100 p-1 mb-6 border border-slate-200">
            <button id="mode-book-btn" onclick="switchMode('book')" class="flex-1 py-2 text-xs font-bold rounded-lg transition-all cursor-pointer bg-white text-blue-600 shadow-sm">📖 紀錄本</button>
            <button id="mode-calc-btn" onclick="switchMode('calc')" class="flex-1 py-2 text-xs font-bold rounded-lg transition-all cursor-pointer text-slate-600 hover:text-slate-900">🧮 計算機</button>
            <button id="mode-summary-btn" onclick="switchMode('summary')" class="flex-1 py-2 text-xs font-bold rounded-lg transition-all cursor-pointer text-slate-600 hover:text-slate-900">📊 成績總表</button>
        </div>

        <!-- ==================== 模式一：成績紀錄本 ==================== -->
        <div id="mode-book-view">
            <!-- 年級選擇 -->
            <div class="mb-4">
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">請選擇年級：</label>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="setGrade('初一')" class="grade-btn py-2 text-sm font-medium rounded-xl border transition-all cursor-pointer bg-blue-600 text-white border-blue-600 shadow-sm">初一</button>
                    <button onclick="setGrade('初二')" class="grade-btn py-2 text-sm font-medium rounded-xl border transition-all cursor-pointer bg-white text-slate-700 border-slate-200 hover:bg-slate-50">初二</button>
                    <button onclick="setGrade('初三')" class="grade-btn py-2 text-sm font-medium rounded-xl border transition-all cursor-pointer bg-white text-slate-700 border-slate-200 hover:bg-slate-50">初三</button>
                </div>
            </div>

            <!-- 學期/範圍選擇 -->
            <div class="mb-4">
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">請選擇範圍：</label>
                <div id="semester-buttons" class="grid grid-cols-2 gap-2">
                    <!-- 動態產生 -->
                </div>
            </div>

            <!-- 考試選擇 -->
            <div class="mb-6">
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">請選擇考試：</label>
                <div id="exam-buttons" class="grid grid-cols-3 gap-2">
                    <!-- 動態產生 -->
                </div>
            </div>

            <!-- 成績輸入區 -->
            <div id="subjects-container" class="space-y-3 mb-6">
                <!-- 動態產生科目欄位 -->
            </div>

            <!-- 結果顯示區 -->
            <div class="bg-gradient-to-br from-slate-900 to-slate-800 text-white rounded-2xl p-5 text-center shadow-lg mb-6">
                <div id="result-title" class="text-xs uppercase tracking-widest text-slate-400 font-semibold mb-1">加權計算結果</div>
                <div id="score-display" class="text-3xl font-black text-amber-400 mb-1">0.0 分</div>
                <div id="sub-display" class="text-sm text-slate-300">加權平均： <span id="avg-display" class="font-bold text-white">0.00</span> 分</div>
                
                <!-- 一般段考期末考排名 -->
                <div class="mt-4 pt-3 border-t border-slate-700/60 grid grid-cols-2 gap-3" id="rank-container-1">
                    <div>
                        <span class="text-xs text-slate-300 font-medium block mb-1">班排名</span>
                        <input type="number" id="class-rank" placeholder="例如: 5" class="w-full bg-slate-800 border border-slate-600 text-center text-white font-bold rounded-lg py-2 text-base focus:outline-none focus:border-amber-400">
                    </div>
                    <div>
                        <span class="text-xs text-slate-300 font-medium block mb-1">校排名</span>
                        <input type="number" id="school-rank" placeholder="例如: 35" class="w-full bg-slate-800 border border-slate-600 text-center text-white font-bold rounded-lg py-2 text-base focus:outline-none focus:border-amber-400">
                    </div>
                </div>

                <!-- 模考專用排名區 -->
                <div class="mt-4 pt-3 border-t border-slate-700/60 space-y-3 hidden" id="rank-container-2">
                    <div class="bg-slate-800/60 p-2.5 rounded-xl border border-slate-700">
                        <span class="text-xs text-slate-300 font-medium block mb-1.5">班排名 / 總人數</span>
                        <div class="flex items-center space-x-2">
                            <input type="number" id="mock-class-rank" placeholder="名次" class="w-full bg-slate-800 border border-slate-600 text-center text-white font-bold rounded-lg py-2 text-base focus:outline-none focus:border-amber-400">
                            <span class="text-slate-400 font-bold text-lg">/</span>
                            <input type="number" id="mock-class-total" placeholder="人數" class="w-full bg-slate-800 border border-slate-600 text-center text-white font-bold rounded-lg py-2 text-base focus:outline-none focus:border-amber-400">
                        </div>
                    </div>
                    <div class="bg-slate-800/60 p-2.5 rounded-xl border border-slate-700">
                        <span class="text-xs text-slate-300 font-medium block mb-1.5">校排名 / 總人數</span>
                        <div class="flex items-center space-x-2">
                            <input type="number" id="mock-school-rank" placeholder="名次" class="w-full bg-slate-800 border border-slate-600 text-center text-white font-bold rounded-lg py-2 text-base focus:outline-none focus:border-amber-400">
                            <span class="text-slate-400 font-bold text-lg">/</span>
                            <input type="number" id="mock-school-total" placeholder="人數" class="w-full bg-slate-800 border border-slate-600 text-center text-white font-bold rounded-lg py-2 text-base focus:outline-none focus:border-amber-400">
                        </div>
                    </div>
                    <div class="bg-slate-800/60 p-2.5 rounded-xl border border-slate-700">
                        <span class="text-xs text-slate-300 font-medium block mb-1.5">區排名 / 總人數</span>
                        <div class="flex items-center space-x-2">
                            <input type="number" id="mock-district-rank" placeholder="名次" class="w-full bg-slate-800 border border-slate-600 text-center text-white font-bold rounded-lg py-2 text-base focus:outline-none focus:border-amber-400">
                            <span class="text-slate-400 font-bold text-lg">/</span>
                            <input type="number" id="mock-district-total" placeholder="人數" class="w-full bg-slate-800 border border-slate-600 text-center text-white font-bold rounded-lg py-2 text-base focus:outline-none focus:border-amber-400">
                        </div>
                    </div>
                    <div class="bg-slate-800/60 p-2.5 rounded-xl border border-slate-700">
                        <span class="text-xs text-slate-300 font-medium block mb-1.5">區(女)排名 / 總人數</span>
                        <div class="flex items-center space-x-2">
                            <input type="number" id="mock-district-female-rank" placeholder="名次" class="w-full bg-slate-800 border border-slate-600 text-center text-white font-bold rounded-lg py-2 text-base focus:outline-none focus:border-amber-400">
                            <span class="text-slate-400 font-bold text-lg">/</span>
                            <input type="number" id="mock-district-female-total" placeholder="人數" class="w-full bg-slate-800 border border-slate-600 text-center text-white font-bold rounded-lg py-2 text-base focus:outline-none focus:border-amber-400">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ==================== 模式二：成績計算機 ==================== -->
        <div id="mode-calc-view" class="hidden">
            <div class="flex items-end justify-between mb-4">
                <div class="flex-1 mr-2">
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">請選擇試算年級：</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="setCalcGrade('初一')" class="calc-grade-btn py-2 text-sm font-medium rounded-xl border transition-all cursor-pointer bg-blue-600 text-white border-blue-600 shadow-sm">初一</button>
                        <button onclick="setCalcGrade('初二')" class="calc-grade-btn py-2 text-sm font-medium rounded-xl border transition-all cursor-pointer bg-white text-slate-700 border-slate-200 hover:bg-slate-50">初二</button>
                        <button onclick="setCalcGrade('初三')" class="calc-grade-btn py-2 text-sm font-medium rounded-xl border transition-all cursor-pointer bg-white text-slate-700 border-slate-200 hover:bg-slate-50">初三</button>
                    </div>
                </div>
                <button onclick="clearCalcData()" class="px-3 py-2 text-xs font-bold bg-rose-50 text-rose-600 border border-rose-200 rounded-xl hover:bg-rose-100 transition-all cursor-pointer h-[38px] whitespace-nowrap">
                    🗑️ 全部清除
                </button>
            </div>

            <div class="overflow-x-auto mb-6 -mx-2 px-2">
                <table class="w-full text-xs text-center border-collapse min-w-[340px]">
                    <thead>
                        <tr class="bg-slate-100 border-b border-slate-200">
                            <th class="p-1.5 text-slate-500 font-bold text-left min-w-[65px]">座號/姓名</th>
                            <th class="p-1"><input type="text" id="calc-name-1" oninput="saveCalcData()" placeholder="同學1" class="w-full bg-white border border-slate-300 text-center text-slate-800 rounded px-1 py-1 focus:outline-none focus:border-blue-500 font-bold"></th>
                            <th class="p-1"><input type="text" id="calc-name-2" oninput="saveCalcData()" placeholder="同學2" class="w-full bg-white border border-slate-300 text-center text-slate-800 rounded px-1 py-1 focus:outline-none focus:border-blue-500 font-bold"></th>
                            <th class="p-1"><input type="text" id="calc-name-3" oninput="saveCalcData()" placeholder="同學3" class="w-full bg-white border border-slate-300 text-center text-slate-800 rounded px-1 py-1 focus:outline-none focus:border-blue-500 font-bold"></th>
                            <th class="p-1"><input type="text" id="calc-name-4" oninput="saveCalcData()" placeholder="同學4" class="w-full bg-white border border-slate-300 text-center text-slate-800 rounded px-1 py-1 focus:outline-none focus:border-blue-500 font-bold"></th>
                        </tr>
                    </thead>
                    <tbody id="calc-table-body"></tbody>
                    <tfoot class="bg-slate-800 text-white font-semibold">
                        <tr class="border-t border-slate-700">
                            <td class="p-1.5 text-left text-slate-300">加權總分</td>
                            <td class="p-1 text-amber-400 font-bold" id="calc-total-1">0.0</td>
                            <td class="p-1 text-amber-400 font-bold" id="calc-total-2">0.0</td>
                            <td class="p-1 text-amber-400 font-bold" id="calc-total-3">0.0</td>
                            <td class="p-1 text-amber-400 font-bold" id="calc-total-4">0.0</td>
                        </tr>
                        <tr>
                            <td class="p-1.5 text-left text-slate-300">加權平均</td>
                            <td class="p-1 font-bold" id="calc-avg-1">0.00</td>
                            <td class="p-1 font-bold" id="calc-avg-2">0.00</td>
                            <td class="p-1 font-bold" id="calc-avg-3">0.00</td>
                            <td class="p-1 font-bold" id="calc-avg-4">0.00</td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>

        <!-- ==================== 模式三：成績總表 (重新編排版) ==================== -->
        <div id="mode-summary-view" class="hidden">
            <div class="mb-4">
                <h2 class="text-sm font-bold text-slate-700">📋 個人三年成績總覽</h2>
            </div>
            
            <div class="space-y-3 mb-6" id="summary-container">
                <!-- 動態載入總表內容 -->
            </div>
        </div>

        <!-- 換機提醒提示框 -->
        <div class="bg-amber-50 border border-amber-200 text-amber-800 text-xs rounded-xl p-3.5 text-left leading-relaxed">
            📱 <b>換機提醒</b>：成績資料僅儲存於您目前這台裝置中。若未來更換手機或清除瀏覽器資料，紀錄將無法自動轉移，建議換機前先抄下成績備份喔！
        </div>

    </div>

    <script>
        const config = {
            "初一": {
                "上學期": {
                    exams: ["第一次段考", "第二次段考", "期末考"],
                    subjects: [
                        { name: "本國文", weight: 5 }, { name: "英語文", weight: 3 }, { name: "數學", weight: 4 },
                        { name: "歷史", weight: 1 }, { name: "地理", weight: 1 }, { name: "公民", weight: 1 }, { name: "生物", weight: 3 }
                    ]
                },
                "下學期": {
                    exams: ["第一次段考", "第二次段考", "期末考"],
                    subjects: [
                        { name: "本國文", weight: 5 }, { name: "英語文", weight: 3 }, { name: "數學", weight: 4 },
                        { name: "歷史", weight: 1 }, { name: "地理", weight: 1 }, { name: "公民", weight: 1 }, { name: "生物", weight: 3 }
                    ]
                }
            },
            "初二": {
                "上學期": {
                    exams: ["第一次段考", "第二次段考", "期末考"],
                    subjects: [
                        { name: "本國文", weight: 5 }, { name: "英語文", weight: 3 }, { name: "數學", weight: 4 },
                        { name: "歷史", weight: 1 }, { name: "地理", weight: 1 }, { name: "公民", weight: 1 }, { name: "理化", weight: 3 }
                    ]
                },
                "下學期": {
                    exams: ["第一次段考", "第二次段考", "期末考"],
                    subjects: [
                        { name: "本國文", weight: 5 }, { name: "英語文", weight: 3 }, { name: "數學", weight: 4 },
                        { name: "歷史", weight: 1 }, { name: "地理", weight: 1 }, { name: "公民", weight: 1 }, { name: "理化", weight: 3 }
                    ]
                }
            },
            "初三": {
                "上學期": {
                    exams: ["第一次段考", "第二次段考", "期末考"],
                    subjects: [
                        { name: "本國文", weight: 5 }, { name: "英語文", weight: 3 }, { name: "數學", weight: 4 },
                        { name: "歷史", weight: 1 }, { name: "地理", weight: 1 }, { name: "公民", weight: 1 },
                        { name: "理化", weight: 2 }, { name: "地科/生物", weight: 1 }
                    ]
                },
                "下學期": {
                    exams: ["第一次段考", "第二次段考", "期末考"],
                    subjects: [
                        { name: "本國文", weight: 5 }, { name: "英語文", weight: 3 }, { name: "數學", weight: 4 },
                        { name: "歷史", weight: 1 }, { name: "地理", weight: 1 }, { name: "公民", weight: 1 },
                        { name: "理化", weight: 2 }, { name: "地科/生物", weight: 1 }
                    ]
                },
                "模擬考": {
                    exams: ["第一次模考", "第二次模考", "第三次模考", "第四次模考"],
                    subjects: [
                        { name: "國文" }, { name: "數學" }, { name: "英語" }, { name: "社會" }, { name: "自然" }, { name: "作文", isComposition: true }
                    ]
                }
            }
        };

        const rankPoints = { "A++": 7, "A+": 6, "A": 5, "B++": 4, "B+": 3, "B": 2, "C": 1 };
        const compositionPoints = { "6級分": 1.0, "5級分": 0.8, "4級分": 0.6, "3級分": 0.4, "2級分": 0.2, "1級分": 0.1, "0級分": 0.0 };

        let currentGrade = "初一";
        let currentSemester = "上學期";
        let currentExam = "第一次段考";
        let calcGrade = "初一";

        // 模式切換 (book / calc / summary)
        function switchMode(mode) {
            const bookBtn = document.getElementById('mode-book-btn');
            const calcBtn = document.getElementById('mode-calc-btn');
            const summaryBtn = document.getElementById('mode-summary-btn');
            const bookView = document.getElementById('mode-book-view');
            const calcView = document.getElementById('mode-calc-view');
            const summaryView = document.getElementById('mode-summary-view');

            bookBtn.className = "flex-1 py-2 text-xs font-bold rounded-lg transition-all cursor-pointer " + (mode === 'book' ? "bg-white text-blue-600 shadow-sm" : "text-slate-600 hover:text-slate-900");
            calcBtn.className = "flex-1 py-2 text-xs font-bold rounded-lg transition-all cursor-pointer " + (mode === 'calc' ? "bg-white text-blue-600 shadow-sm" : "text-slate-600 hover:text-slate-900");
            summaryBtn.className = "flex-1 py-2 text-xs font-bold rounded-lg transition-all cursor-pointer " + (mode === 'summary' ? "bg-white text-blue-600 shadow-sm" : "text-slate-600 hover:text-slate-900");

            bookView.classList.toggle('hidden', mode !== 'book');
            calcView.classList.toggle('hidden', mode !== 'calc');
            summaryView.classList.toggle('hidden', mode !== 'summary');

            if (mode === 'calc') {
                renderCalcStudents();
                loadCalcData();
            } else if (mode === 'summary') {
                renderSummaryTable();
            }
        }

        // --- 成績紀錄本邏輯 ---
        function setGrade(grade) {
            currentGrade = grade;
            document.querySelectorAll('.grade-btn').forEach(btn => {
                btn.className = btn.innerText === grade 
                    ? "grade-btn py-2 text-sm font-medium rounded-xl border transition-all cursor-pointer bg-blue-600 text-white border-blue-600 shadow-sm"
                    : "grade-btn py-2 text-sm font-medium rounded-xl border transition-all cursor-pointer bg-white text-slate-700 border-slate-200 hover:bg-slate-50";
            });

            const availableSemesters = Object.keys(config[currentGrade]);
            if (!availableSemesters.includes(currentSemester)) {
                currentSemester = availableSemesters[0];
            }

            renderSemesters();
            validateAndRefresh();
        }

        function renderSemesters() {
            const container = document.getElementById('semester-buttons');
            container.innerHTML = '';
            const semesters = Object.keys(config[currentGrade]);
            container.className = semesters.length === 3 ? "grid grid-cols-3 gap-2" : "grid grid-cols-2 gap-2";

            semesters.forEach(sem => {
                const btn = document.createElement('button');
                btn.innerText = sem;
                btn.onclick = () => {
                    currentSemester = sem;
                    renderSemesters();
                    validateAndRefresh();
                };
                btn.className = sem === currentSemester
                    ? "semester-btn py-2 text-sm font-medium rounded-xl border transition-all cursor-pointer bg-blue-600 text-white border-blue-600 shadow-sm"
                    : "semester-btn py-2 text-sm font-medium rounded-xl border transition-all cursor-pointer bg-white text-slate-700 border-slate-200 hover:bg-slate-50";
                container.appendChild(btn);
            });
        }

        function validateAndRefresh() {
            const exams = config[currentGrade][currentSemester].exams;
            if (!exams.includes(currentExam)) {
                currentExam = exams[0];
            }
            renderExams();
            renderSubjects();
            loadData();
        }

        function renderExams() {
            const exams = config[currentGrade][currentSemester].exams;
            const container = document.getElementById('exam-buttons');
            container.innerHTML = '';
            container.className = exams.length === 4 ? "grid grid-cols-2 gap-2" : "grid grid-cols-3 gap-2";

            exams.forEach((exam) => {
                const btn = document.createElement('button');
                btn.innerText = exam;
                btn.onclick = () => {
                    currentExam = exam;
                    renderExams();
                    renderSubjects();
                    loadData();
                };
                btn.className = exam === currentExam 
                    ? "exam-btn py-2 text-xs font-medium rounded-xl border transition-all cursor-pointer bg-blue-600 text-white border-blue-600 shadow-sm"
                    : "exam-btn py-2 text-xs font-medium rounded-xl border transition-all cursor-pointer bg-white text-slate-700 border-slate-200 hover:bg-slate-50";
                container.appendChild(btn);
            });

            const isMock = currentSemester === "模擬考";
            document.getElementById('rank-container-1').classList.toggle('hidden', isMock);
            document.getElementById('rank-container-2').classList.toggle('hidden', !isMock);
        }

        function renderSubjects() {
            const container = document.getElementById('subjects-container');
            container.innerHTML = '';

            const isMock = currentSemester === "模擬考";
            const subjectsList = config[currentGrade][currentSemester].subjects;

            subjectsList.forEach((sub, idx) => {
                const row = document.createElement('div');
                row.className = "flex items-center justify-between bg-slate-50 p-2.5 rounded-xl border border-slate-100";
                
                const label = document.createElement('span');
                label.className = "text-sm font-medium text-slate-700";
                label.innerText = isMock ? sub.name : `${sub.name} (x${sub.weight})`;
                row.appendChild(label);

                if (isMock) {
                    const select = document.createElement('select');
                    select.id = `sub-${idx}`;
                    select.className = "bg-white border border-slate-300 text-slate-800 text-sm rounded-lg px-3 py-1.5 focus:outline-none focus:border-blue-500 font-medium";
                    select.onchange = saveDataAndCalculate;
                    
                    const defaultOpt = document.createElement('option');
                    defaultOpt.value = "";
                    defaultOpt.innerText = sub.isComposition ? "請選擇級分" : "請選擇等第";
                    defaultOpt.disabled = true;
                    defaultOpt.selected = true;
                    select.appendChild(defaultOpt);

                    const targetMap = sub.isComposition ? compositionPoints : rankPoints;
                    Object.keys(targetMap).forEach(k => {
                        const opt = document.createElement('option');
                        opt.value = k;
                        opt.innerText = `${k} (${targetMap[k]}分)`;
                        select.appendChild(opt);
                    });
                    row.appendChild(select);
                } else {
                    const input = document.createElement('input');
                    input.type = "number";
                    input.id = `sub-${idx}`;
                    input.placeholder = "請輸入";
                    input.className = "w-28 bg-white border border-slate-300 text-right px-3 py-1.5 rounded-lg text-sm focus:outline-none focus:border-blue-500";
                    input.oninput = saveDataAndCalculate;
                    row.appendChild(input);
                }
                container.appendChild(row);
            });
        }

        function saveDataAndCalculate() {
            const isMock = currentSemester === "模擬考";
            const subjectsList = config[currentGrade][currentSemester].subjects;
            
            let data = { 
                scores: {}, 
                classRank: document.getElementById('class-rank').value, 
                schoolRank: document.getElementById('school-rank').value,
                mockClassRank: document.getElementById('mock-class-rank').value,
                mockClassTotal: document.getElementById('mock-class-total').value,
                mockSchoolRank: document.getElementById('mock-school-rank').value,
                mockSchoolTotal: document.getElementById('mock-school-total').value,
                mockDistrictRank: document.getElementById('mock-district-rank').value,
                mockDistrictTotal: document.getElementById('mock-district-total').value,
                mockDistrictFemaleRank: document.getElementById('mock-district-female-rank').value,
                mockDistrictFemaleTotal: document.getElementById('mock-district-female-total').value
            };

            subjectsList.forEach((sub, idx) => {
                data.scores[idx] = document.getElementById(`sub-${idx}`).value;
            });

            localStorage.setItem(`skgsh_${currentGrade}_${currentSemester}_${currentExam}`, JSON.stringify(data));
            calculate();
        }

        function calculate() {
            const isMock = currentSemester === "模擬考";
            const subjectsList = config[currentGrade][currentSemester].subjects;

            let totalScore = 0;
            let totalWeight = 0;
            let totalPoints = 0;

            subjectsList.forEach((sub, idx) => {
                const el = document.getElementById(`sub-${idx}`);
                if (!el) return;
                const val = el.value;
                if (isMock) {
                    if (sub.isComposition && compositionPoints[val] !== undefined) {
                        totalPoints += compositionPoints[val];
                    } else if (!sub.isComposition && rankPoints[val] !== undefined) {
                        totalPoints += rankPoints[val];
                    }
                } else {
                    const score = parseFloat(val);
                    if (!isNaN(score)) {
                        totalScore += score * sub.weight;
                        totalWeight += sub.weight;
                    }
                }
            });

            const resultTitle = document.getElementById('result-title');
            const scoreDisplay = document.getElementById('score-display');
            const subDisplay = document.getElementById('sub-display');

            if (isMock) {
                resultTitle.innerText = "模考總積分計算結果";
                scoreDisplay.innerText = `${totalPoints.toFixed(1)} 積分`;
                subDisplay.innerHTML = `採計科目： <span class="font-bold text-white">5科 + 作文</span>`;
            } else {
                resultTitle.innerText = "加權計算結果";
                const avg = totalWeight > 0 ? (totalScore / totalWeight).toFixed(2) : "0.00";
                scoreDisplay.innerText = `${totalScore.toFixed(1)} 分`;
                subDisplay.innerHTML = `加權平均： <span class="font-bold text-white">${avg}</span> 分`;
            }
        }

        function loadData() {
            const saved = localStorage.getItem(`skgsh_${currentGrade}_${currentSemester}_${currentExam}`);
            const isMock = currentSemester === "模擬考";
            const subjectsList = config[currentGrade][currentSemester].subjects;

            if (saved) {
                const data = JSON.parse(saved);
                subjectsList.forEach((sub, idx) => {
                    const el = document.getElementById(`sub-${idx}`);
                    if (el && data.scores && data.scores[idx] !== undefined) {
                        el.value = data.scores[idx];
                    }
                });
                document.getElementById('class-rank').value = data.classRank || '';
                document.getElementById('school-rank').value = data.schoolRank || '';
                document.getElementById('mock-class-rank').value = data.mockClassRank || '';
                document.getElementById('mock-class-total').value = data.mockClassTotal || '';
                document.getElementById('mock-school-rank').value = data.mockSchoolRank || '';
                document.getElementById('mock-school-total').value = data.mockSchoolTotal || '';
                document.getElementById('mock-district-rank').value = data.mockDistrictRank || '';
                document.getElementById('mock-district-total').value = data.mockDistrictTotal || '';
                document.getElementById('mock-district-female-rank').value = data.mockDistrictFemaleRank || '';
                document.getElementById('mock-district-female-total').value = data.mockDistrictFemaleTotal || '';
            } else {
                subjectsList.forEach((sub, idx) => {
                    const el = document.getElementById(`sub-${idx}`);
                    if (el) el.value = "";
                });
                ['class-rank', 'school-rank', 'mock-class-rank', 'mock-class-total', 'mock-school-rank', 'mock-school-total', 'mock-district-rank', 'mock-district-total', 'mock-district-female-rank', 'mock-district-female-total'].forEach(id => {
                    const el = document.getElementById(id);
                    if(el) el.value = '';
                });
            }
            calculate();
        }

        // --- 成績總表邏輯 (全新清晰卡片編排) ---
        function renderSummaryTable() {
            const container = document.getElementById('summary-container');
            container.innerHTML = '';

            const grades = ["初一", "初二", "初三"];
            
            grades.forEach(grade => {
                const semesters = Object.keys(config[grade]);
                semesters.forEach(sem => {
                    const exams = config[grade][sem].exams;
                    const subjects = config[grade][sem].subjects;
                    const isMock = sem === "模擬考";

                    exams.forEach(exam => {
                        const saved = localStorage.getItem(`skgsh_${grade}_${sem}_${exam}`);
                        let totalScore = 0;
                        let totalWeight = 0;
                        let totalPoints = 0;
                        let hasData = false;
                        let ranksHtml = "";

                        if (saved) {
                            const data = JSON.parse(saved);
                            subjects.forEach((sub, idx) => {
                                const val = data.scores ? data.scores[idx] : "";
                                if (val !== "" && val !== undefined) {
                                    hasData = true;
                                    if (isMock) {
                                        if (sub.isComposition && compositionPoints[val] !== undefined) totalPoints += compositionPoints[val];
                                        else if (!sub.isComposition && rankPoints[val] !== undefined) totalPoints += rankPoints[val];
                                    } else {
                                        const score = parseFloat(val);
                                        if (!isNaN(score)) {
                                            totalScore += score * sub.weight;
                                            totalWeight += sub.weight;
                                        }
                                    }
                                }
                            });

                            if (isMock) {
                                let rankArr = [];
                                if (data.mockClassRank) rankArr.push(`班排名:${data.mockClassRank}`);
                                if (data.mockSchoolRank) rankArr.push(`校排名:${data.mockSchoolRank}`);
                                if (data.mockDistrictRank) rankArr.push(`區排名:${data.mockDistrictRank}`);
                                if (data.mockDistrictFemaleRank) rankArr.push(`區(女)排名:${data.mockDistrictFemaleRank}`);
                                if (rankArr.length > 0) {
                                    ranksHtml = `<div class="text-xs text-slate-600 font-medium mt-1">${rankArr.join(' | ')}</div>`;
                                }
                            } else {
                                let rankArr = [];
                                if (data.classRank) rankArr.push(`班排名:${data.classRank}`);
                                if (data.schoolRank) rankArr.push(`校排名:${data.schoolRank}`);
                                if (rankArr.length > 0) {
                                    ranksHtml = `<div class="text-xs text-slate-600 font-medium mt-1">${rankArr.join(' | ')}</div>`;
                                }
                            }
                        }

                        const card = document.createElement('div');
                        card.className = "bg-slate-50 border border-slate-200 rounded-xl p-4 shadow-xs";

                        let scoreInfo = "";
                        if (!hasData) {
                            scoreInfo = `<span class="text-slate-400 italic text-xs">尚未輸入成績</span>`;
                        } else if (isMock) {
                            scoreInfo = `<div class="text-amber-600 font-black text-lg">${totalPoints.toFixed(1)} <span class="text-xs font-bold text-amber-700">積分</span></div>`;
                        } else {
                            const avg = totalWeight > 0 ? (totalScore / totalWeight).toFixed(2) : "0.00";
                            scoreInfo = `
                                <div class="text-blue-600 font-black text-lg">${totalScore.toFixed(1)} <span class="text-xs font-bold text-blue-700">分</span></div>
                                <div class="text-slate-500 text-xs font-semibold">加權平均 ${avg}</div>
                            `;
                        }

                        card.innerHTML = `
                            <div class="flex items-start justify-between">
                                <div>
                                    <span class="inline-block bg-blue-100 text-blue-700 text-[10px] font-bold px-2 py-0.5 rounded-md mb-1">${grade} · ${sem}</span>
                                    <div class="text-base font-black text-slate-900">${exam}</div>
                                </div>
                                <div class="text-right">
                                    ${scoreInfo}
                                </div>
                            </div>
                            ${hasData && ranksHtml ? `<div class="mt-2 pt-2 border-t border-slate-200">${ranksHtml}</div>` : ''}
                        `;
                        container.appendChild(card);
                    });
                });
            });
        }

        // --- 成績計算機 (橫向表格) 邏輯 ---
        function setCalcGrade(grade) {
            calcGrade = grade;
            document.querySelectorAll('.calc-grade-btn').forEach(btn => {
                btn.className = btn.innerText === grade 
                    ? "calc-grade-btn py-2 text-sm font-medium rounded-xl border transition-all cursor-pointer bg-blue-600 text-white border-blue-600 shadow-sm"
                    : "calc-grade-btn py-2 text-sm font-medium rounded-xl border transition-all cursor-pointer bg-white text-slate-700 border-slate-200 hover:bg-slate-50";
            });
            renderCalcStudents();
            loadCalcData();
        }

        function renderCalcStudents() {
            const tbody = document.getElementById('calc-table-body');
            tbody.innerHTML = '';
            const subjects = config[calcGrade]["上學期"].subjects;

            subjects.forEach((sub, subIdx) => {
                const tr = document.createElement('tr');
                tr.className = "border-b border-slate-100 hover:bg-slate-50";

                let rowHtml = `<td class="p-1.5 text-left font-medium text-slate-700 whitespace-nowrap">${sub.name}<span class="text-slate-400 text-[10px] ml-0.5">x${sub.weight}</span></td>`;

                for (let s = 1; s <= 4; s++) {
                    rowHtml += `
                        <td class="p-1">
                            <input type="number" id="calc-score-${s}-${subIdx}" oninput="saveCalcData()" placeholder="分數" class="w-full bg-white border border-slate-200 rounded text-center py-1 text-xs focus:outline-none focus:border-blue-500">
                        </td>
                    `;
                }
                tr.innerHTML = rowHtml;
                tbody.appendChild(tr);
            });
        }

        function saveCalcData() {
            const subjects = config[calcGrade]["上學期"].subjects;
            let calcData = { names: {}, scores: {} };

            for (let s = 1; s <= 4; s++) {
                const nameInput = document.getElementById(`calc-name-${s}`);
                if (nameInput) calcData.names[s] = nameInput.value;

                calcData.scores[s] = {};
                subjects.forEach((sub, subIdx) => {
                    const scoreInput = document.getElementById(`calc-score-${s}-${subIdx}`);
                    if (scoreInput) calcData.scores[s][subIdx] = scoreInput.value;
                });
            }

            localStorage.setItem(`skgsh_calc_${calcGrade}`, JSON.stringify(calcData));
            calculateAllCalcStudents();
        }

        function loadCalcData() {
            const saved = localStorage.getItem(`skgsh_calc_${calcGrade}`);
            const subjects = config[calcGrade]["上學期"].subjects;

            for (let s = 1; s <= 4; s++) {
                const nameInput = document.getElementById(`calc-name-${s}`);
                if (nameInput) nameInput.value = "";

                subjects.forEach((sub, subIdx) => {
                    const scoreInput = document.getElementById(`calc-score-${s}-${subIdx}`);
                    if (scoreInput) scoreInput.value = "";
                });
            }

            if (saved) {
                const calcData = JSON.parse(saved);
                for (let s = 1; s <= 4; s++) {
                    if (calcData.names && calcData.names[s] !== undefined) {
                        const nameInput = document.getElementById(`calc-name-${s}`);
                        if (nameInput) nameInput.value = calcData.names[s];
                    }
                    if (calcData.scores && calcData.scores[s]) {
                        subjects.forEach((sub, subIdx) => {
                            if (calcData.scores[s][subIdx] !== undefined) {
                                const scoreInput = document.getElementById(`calc-score-${s}-${subIdx}`);
                                if (scoreInput) scoreInput.value = calcData.scores[s][subIdx];
                            }
                        });
                    }
                }
            }
            calculateAllCalcStudents();
        }

        function calculateAllCalcStudents() {
            const subjects = config[calcGrade]["上學期"].subjects;

            for (let s = 1; s <= 4; s++) {
                let totalScore = 0;
                let totalWeight = 0;

                subjects.forEach((sub, subIdx) => {
                    const input = document.getElementById(`calc-score-${s}-${subIdx}`);
                    if (input) {
                        const val = parseFloat(input.value);
                        if (!isNaN(val)) {
                            totalScore += val * sub.weight;
                            totalWeight += sub.weight;
                        }
                    }
                });

                document.getElementById(`calc-total-${s}`).innerText = totalScore.toFixed(1);
                document.getElementById(`calc-avg-${s}`).innerText = totalWeight > 0 ? (totalScore / totalWeight).toFixed(2) : "0.00";
            }
        }

        function clearCalcData() {
            if (confirm("確定要清除目前內部的所有姓名與成績嗎？")) {
                localStorage.removeItem(`skgsh_calc_${calcGrade}`);
                loadCalcData();
            }
        }

        ['class-rank', 'school-rank', 'mock-class-rank', 'mock-class-total', 'mock-school-rank', 'mock-school-total', 'mock-district-rank', 'mock-district-total', 'mock-district-female-rank', 'mock-district-female-total'].forEach(id => {
            const el = document.getElementById(id);
            if(el) el.addEventListener('input', saveDataAndCalculate);
        });

        // 初始化
        renderSemesters();
        setGrade("初一");
    </script>
</body>
</html>
