<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聖功女中國中部-成績紀錄器</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen py-8 px-4">
    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-xl p-6 border border-slate-100">
        
        <!-- 標題 -->
        <h1 class="text-2xl font-bold text-center text-slate-800 mb-2">📊 聖功女中國中部-成績紀錄器</h1>
        
        <!-- 隱私說明提示 -->
        <div class="bg-blue-50 border border-blue-100 text-blue-700 text-xs rounded-lg p-3 mb-6 text-center leading-relaxed">
            💡 <b>隱私說明</b>：本工具所有成績皆僅儲存於您自己的手機或電腦裝置中，分享網址或重新整理皆不會洩漏或共用個人分數，請安心使用！
        </div>

        <!-- 年級選擇 -->
        <div class="mb-5">
            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">請選擇年級：</label>
            <div class="grid grid-cols-3 gap-2" id="grade-buttons">
                <button onclick="setGrade('初一')" class="grade-btn py-2 text-sm font-medium rounded-xl border transition-all cursor-pointer bg-blue-600 text-white border-blue-600 shadow-sm">初一</button>
                <button onclick="setGrade('初二')" class="grade-btn py-2 text-sm font-medium rounded-xl border transition-all cursor-pointer bg-white text-slate-700 border-slate-200 hover:bg-slate-50">初二</button>
                <button onclick="setGrade('初三')" class="grade-btn py-2 text-sm font-medium rounded-xl border transition-all cursor-pointer bg-white text-slate-700 border-slate-200 hover:bg-slate-50">初三</button>
            </div>
        </div>

        <!-- 考試選擇 -->
        <div class="mb-6">
            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">請選擇考試：</label>
            <div id="exam-buttons" class="grid grid-cols-3 gap-2">
                <!-- 動態產生 -->
            </div>
        </div>

        <!-- 成績輸入區 -->
        <div id="subjects-container" class="space-y-4 mb-6">
            <!-- 動態產生科目欄位 -->
        </div>

        <!-- 結果顯示區 -->
        <div class="bg-gradient-to-br from-slate-900 to-slate-800 text-white rounded-2xl p-5 text-center shadow-lg">
            <div id="result-title" class="text-xs uppercase tracking-widest text-slate-400 font-semibold mb-1">加權計算結果</div>
            <div id="score-display" class="text-3xl font-black text-amber-400 mb-1">0.0 分</div>
            <div id="sub-display" class="text-sm text-slate-300">加權平均： <span id="avg-display" class="font-bold text-white">0.00</span> 分</div>
            
            <!-- 一般段考期末考排名 -->
            <div class="mt-4 pt-3 border-t border-slate-700/60 grid grid-cols-2 gap-3" id="rank-container-1">
                <div>
                    <span class="text-xs text-slate-300 font-medium block mb-1">班排名 / 人數</span>
                    <div class="flex items-center space-x-1">
                        <input type="number" id="class-rank" placeholder="名次" class="w-full bg-slate-800 border border-slate-600 text-center text-white font-bold rounded-lg py-2 text-base focus:outline-none focus:border-amber-400">
                        <span class="text-slate-400 font-bold">/</span>
                        <input type="number" id="class-total" placeholder="人數" class="w-full bg-slate-800 border border-slate-600 text-center text-white font-bold rounded-lg py-2 text-base focus:outline-none focus:border-amber-400">
                    </div>
                </div>
                <div>
                    <span class="text-xs text-slate-300 font-medium block mb-1">校排名 / 人數</span>
                    <div class="flex items-center space-x-1">
                        <input type="number" id="school-rank" placeholder="名次" class="w-full bg-slate-800 border border-slate-600 text-center text-white font-bold rounded-lg py-2 text-base focus:outline-none focus:border-amber-400">
                        <span class="text-slate-400 font-bold">/</span>
                        <input type="number" id="school-total" placeholder="人數" class="w-full bg-slate-800 border border-slate-600 text-center text-white font-bold rounded-lg py-2 text-base focus:outline-none focus:border-amber-400">
                    </div>
                </div>
            </div>

            <!-- 模考專用額外排名區 (區排名、區女排名) -->
            <div class="mt-3 grid grid-cols-2 gap-3 hidden" id="rank-container-2">
                <div>
                    <span class="text-xs text-slate-300 font-medium block mb-1">區排名 / 人數</span>
                    <div class="flex items-center space-x-1">
                        <input type="number" id="district-rank" placeholder="名次" class="w-full bg-slate-800 border border-slate-600 text-center text-white font-bold rounded-lg py-2 text-base focus:outline-none focus:border-amber-400">
                        <span class="text-slate-400 font-bold">/</span>
                        <input type="number" id="district-total" placeholder="人數" class="w-full bg-slate-800 border border-slate-600 text-center text-white font-bold rounded-lg py-2 text-base focus:outline-none focus:border-amber-400">
                    </div>
                </div>
                <div>
                    <span class="text-xs text-slate-300 font-medium block mb-1">區(女)排名 / 人數</span>
                    <div class="flex items-center space-x-1">
                        <input type="number" id="district-female-rank" placeholder="名次" class="w-full bg-slate-800 border border-slate-600 text-center text-white font-bold rounded-lg py-2 text-base focus:outline-none focus:border-amber-400">
                        <span class="text-slate-400 font-bold">/</span>
                        <input type="number" id="district-female-total" placeholder="人數" class="w-full bg-slate-800 border border-slate-600 text-center text-white font-bold rounded-lg py-2 text-base focus:outline-none focus:border-amber-400">
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const config = {
            "初一": {
                exams: ["第一次段考", "第二次段考", "期末考"],
                subjects: [
                    { name: "本國文", weight: 5 },
                    { name: "英語文", weight: 3 },
                    { name: "數學", weight: 4 },
                    { name: "歷史", weight: 1 },
                    { name: "地理", weight: 1 },
                    { name: "公民", weight: 1 },
                    { name: "生物", weight: 3 }
                ]
            },
            "初二": {
                exams: ["第一次段考", "第二次段考", "期末考"],
                subjects: [
                    { name: "本國文", weight: 5 },
                    { name: "英語文", weight: 3 },
                    { name: "數學", weight: 4 },
                    { name: "歷史", weight: 1 },
                    { name: "地理", weight: 1 },
                    { name: "公民", weight: 1 },
                    { name: "理化", weight: 3 }
                ]
            },
            "初三": {
                exams: ["第一次段考", "第二次段考", "期末考", "第一次模考", "第二次模考", "第三次模考", "第四次模考"],
                subjects: [
                    { name: "本國文", weight: 5 },
                    { name: "英語文", weight: 3 },
                    { name: "數學", weight: 4 },
                    { name: "歷史", weight: 1 },
                    { name: "地理", weight: 1 },
                    { name: "公民", weight: 1 },
                    { name: "理化", weight: 3 }
                ]
            }
        };

        const mockSubjects = [
            { name: "國文" },
            { name: "數學" },
            { name: "英語" },
            { name: "社會" },
            { name: "自然" },
            { name: "作文", isComposition: true }
        ];

        const rankPoints = {
            "A++": 7,
            "A+": 6,
            "A": 5,
            "B++": 4,
            "B+": 3,
            "B": 2,
            "C": 1
        };

        const compositionPoints = {
            "6級分": 1.0,
            "5級分": 0.8,
            "4級分": 0.6,
            "3級分": 0.4,
            "2級分": 0.2,
            "1級分": 0.1,
            "0級分": 0.0
        };

        let currentGrade = "初一";
        let currentExam = "第一次段考";

        function setGrade(grade) {
            currentGrade = grade;
            
            document.querySelectorAll('.grade-btn').forEach(btn => {
                if(btn.innerText === grade) {
                    btn.className = "grade-btn py-2 text-sm font-medium rounded-xl border transition-all cursor-pointer bg-blue-600 text-white border-blue-600 shadow-sm";
                } else {
                    btn.className = "grade-btn py-2 text-sm font-medium rounded-xl border transition-all cursor-pointer bg-white text-slate-700 border-slate-200 hover:bg-slate-50";
                }
            });

            const exams = config[grade].exams;
            if (!exams.includes(currentExam)) {
                currentExam = exams[0];
            }
            renderExams();
            renderSubjects();
            loadData();
        }

        function renderExams() {
            const exams = config[currentGrade].exams;
            const container = document.getElementById('exam-buttons');
            container.innerHTML = '';
            
            if (currentGrade === "初三") {
                container.className = "grid grid-cols-3 gap-2";
                exams.forEach((exam, idx) => {
                    const btn = document.createElement('button');
                    btn.innerText = exam;
                    btn.onclick = () => {
                        currentExam = exam;
                        renderExams();
                        renderSubjects();
                        loadData();
                    };
                    if(idx === 3) {
                        const spacer = document.createElement('div');
                        spacer.className = "col-span-3 h-1";
                        container.appendChild(spacer);
                    }
                    if(exam === currentExam) {
                        btn.className = "exam-btn py-2 text-xs font-medium rounded-xl border transition-all cursor-pointer bg-slate-900 text-white border-slate-900 shadow-sm";
                    } else {
                        btn.className = "exam-btn py-2 text-xs font-medium rounded-xl border transition-all cursor-pointer bg-white text-slate-700 border-slate-200 hover:bg-slate-50";
                    }
                    container.appendChild(btn);
                });
            } else {
                container.className = "grid grid-cols-3 gap-2";
                exams.forEach(exam => {
                    const btn = document.createElement('button');
                    btn.innerText = exam;
                    btn.onclick = () => {
                        currentExam = exam;
                        renderExams();
                        renderSubjects();
                        loadData();
                    };
                    if(exam === currentExam) {
                        btn.className = "exam-btn py-2 text-xs font-medium rounded-xl border transition-all cursor-pointer bg-slate-900 text-white border-slate-900 shadow-sm";
                    } else {
                        btn.className = "exam-btn py-2 text-xs font-medium rounded-xl border transition-all cursor-pointer bg-white text-slate-700 border-slate-200 hover:bg-slate-50";
                    }
                    container.appendChild(btn);
                });
            }

            const isMock = currentExam.includes("模考");
            const rankContainer2 = document.getElementById('rank-container-2');
            if (isMock) {
                rankContainer2.classList.remove('hidden');
            } else {
                rankContainer2.classList.add('hidden');
            }
        }

        function renderSubjects() {
            const container = document.getElementById('subjects-container');
            container.innerHTML = '';

            const isMock = currentExam.includes("模考");
            const subjectsList = isMock ? mockSubjects : config[currentGrade].subjects;

            subjectsList.forEach((sub, idx) => {
                const row = document.createElement('div');
                row.className = "flex items-center justify-between bg-slate-50 p-2.5 rounded-xl border border-slate-100";
                
                const label = document.createElement('span');
                label.className = "text-sm font-medium text-slate-700";
                label.innerText = isMock ? sub.name : `${sub.name} (x${sub.weight})`;
                row.appendChild(label);

                if (isMock) {
                    const select = document.createElement('select');
                    select.id = `sub-${idx}`;
                    select.className = "bg-white border border-slate-300 text-slate-800 text-sm rounded-lg px-3 py-1.5 focus:outline-none focus:border-blue-500 font-medium";
                    select.onchange = saveDataAndCalculate;
                    
                    const defaultOpt = document.createElement('option');
                    defaultOpt.value = "";
                    defaultOpt.innerText = sub.isComposition ? "請選擇級分" : "請選擇等第";
                    defaultOpt.disabled = true;
                    defaultOpt.selected = true;
                    select.appendChild(defaultOpt);

                    if (sub.isComposition) {
                        Object.keys(compositionPoints).forEach(comp => {
                            const opt = document.createElement('option');
                            opt.value = comp;
                            opt.innerText = `${comp} (${compositionPoints[comp]}分)`;
                            select.appendChild(opt);
                        });
                    } else {
                        Object.keys(rankPoints).forEach(rank => {
                            const opt = document.createElement('option');
                            opt.value = rank;
                            opt.innerText = `${rank} (${rankPoints[rank]}分)`;
                            select.appendChild(opt);
                        });
                    }
                    row.appendChild(select);
                } else {
                    const input = document.createElement('input');
                    input.type = "number";
                    input.id = `sub-${idx}`;
                    input.placeholder = "請輸入";
                    input.className = "w-28 bg-white border border-slate-300 text-right px-3 py-1.5 rounded-lg text-sm focus:outline-none focus:border-blue-500";
                    input.oninput = saveDataAndCalculate;
                    row.appendChild(input);
                }

                container.appendChild(row);
            });
        }

        function saveDataAndCalculate() {
            const isMock = currentExam.includes("模考");
            const subjectsList = isMock ? mockSubjects : config[currentGrade].subjects;
            
            let data = { 
                scores: {}, 
                classRank: document.getElementById('class-rank').value, 
                classTotal: document.getElementById('class-total').value,
                schoolRank: document.getElementById('school-rank').value,
                schoolTotal: document.getElementById('school-total').value,
                districtRank: document.getElementById('district-rank').value,
                districtTotal: document.getElementById('district-total').value,
                districtFemaleRank: document.getElementById('district-female-rank').value,
                districtFemaleTotal: document.getElementById('district-female-total').value
            };

            subjectsList.forEach((sub, idx) => {
                const val = document.getElementById(`sub-${idx}`).value;
                data.scores[idx] = val;
            });

            localStorage.setItem(`skgsh_${currentGrade}_${currentExam}`, JSON.stringify(data));
            calculate();
        }

        function calculate() {
            const isMock = currentExam.includes("模考");
            const subjectsList = isMock ? mockSubjects : config[currentGrade].subjects;

            let totalScore = 0;
            let totalWeight = 0;
            let totalPoints = 0;

            subjectsList.forEach((sub, idx) => {
                const val = document.getElementById(`sub-${idx}`).value;
                if (isMock) {
                    if (sub.isComposition) {
                        if (val && compositionPoints[val] !== undefined) {
                            totalPoints += compositionPoints[val];
                        }
                    } else {
                        if (val && rankPoints[val] !== undefined) {
                            totalPoints += rankPoints[val];
                        }
                    }
                } else {
                    const score = parseFloat(val);
                    if (!isNaN(score)) {
                        totalScore += score * sub.weight;
                        totalWeight += sub.weight;
                    }
                }
            });

            const resultTitle = document.getElementById('result-title');
            const scoreDisplay = document.getElementById('score-display');
            const subDisplay = document.getElementById('sub-display');

            if (isMock) {
                resultTitle.innerText = "模考總積分計算結果";
                scoreDisplay.innerText = `${totalPoints.toFixed(1)} 積分`;
                subDisplay.innerHTML = `採計科目： <span class="font-bold text-white">5科 + 作文</span>`;
            } else {
                resultTitle.innerText = "加權計算結果";
                const avg = totalWeight > 0 ? (totalScore / totalWeight).toFixed(2) : "0.00";
                scoreDisplay.innerText = `${totalScore.toFixed(1)} 分`;
                subDisplay.innerHTML = `加權平均： <span class="font-bold text-white">${avg}</span> 分`;
            }
        }

        function loadData() {
            const saved = localStorage.getItem(`skgsh_${currentGrade}_${currentExam}`);
            const isMock = currentExam.includes("模考");
            const subjectsList = isMock ? mockSubjects : config[currentGrade].subjects;

            if (saved) {
                const data = JSON.parse(saved);
                subjectsList.forEach((sub, idx) => {
                    const el = document.getElementById(`sub-${idx}`);
                    if (el && data.scores && data.scores[idx] !== undefined) {
                        el.value = data.scores[idx];
                    }
                });
                document.getElementById('class-rank').value = data.classRank || '';
                document.getElementById('class-total').value = data.classTotal || '';
                document.getElementById('school-rank').value = data.schoolRank || '';
                document.getElementById('school-total').value = data.schoolTotal || '';
                document.getElementById('district-rank').value = data.districtRank || '';
                document.getElementById('district-total').value = data.districtTotal || '';
                document.getElementById('district-female-rank').value = data.districtFemaleRank || '';
                document.getElementById('district-female-total').value = data.districtFemaleTotal || '';
            } else {
                subjectsList.forEach((sub, idx) => {
                    const el = document.getElementById(`sub-${idx}`);
                    if (el) el.value = "";
                });
                document.getElementById('class-rank').value = '';
                document.getElementById('class-total').value = '';
                document.getElementById('school-rank').value = '';
                document.getElementById('school-total').value = '';
                document.getElementById('district-rank').value = '';
                document.getElementById('district-total').value = '';
                document.getElementById('district-female-rank').value = '';
                document.getElementById('district-female-total').value = '';
            }
            calculate();
        }

        ['class-rank', 'class-total', 'school-rank', 'school-total', 'district-rank', 'district-total', 'district-female-rank', 'district-female-total'].forEach(id => {
            document.getElementById(id).addEventListener('input', saveDataAndCalculate);
        });

        setGrade("初一");
    </script>
</body>
</html>
